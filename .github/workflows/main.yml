name: Validation

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore --tool-manifest dotnet-tools.json

      - name: Restore dependencies
        run: dotnet restore OpenGE.slnx

      - name: Check formatting
        run: dotnet csharpier check .

      - name: Build
        run: dotnet build OpenGE.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenGE.slnx --configuration Release --no-build
